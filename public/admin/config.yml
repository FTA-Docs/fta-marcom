backend:
  name: github
  repo: FTA-Docs/fta-marcom
  branch: dev
  base_url: https://marcom-dev.fta.care
  auth_endpoint: api/auth

local_backend: false


media_folder: public
public_folder: /

collections:

  # ─── Homepage ────────────────────────────────────────────────────────────────
  - name: homepage
    label: Homepage
    files:
      - label: Homepage Content
        name: home
        file: content/home.json
        fields:

          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Headline, name: headline, widget: string }
              - { label: Subheadline, name: subheadline, widget: text }
              - label: Primary CTA
                name: cta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: href, widget: string }
              - label: Secondary CTA
                name: cta2
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: href, widget: string }

          - label: Problem Section
            name: problem
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Subheading, name: subheading, widget: string }
              - label: Quotes
                name: quotes
                widget: list
                fields:
                  - { label: Quote, name: quote, widget: string }
                  - { label: Emotion, name: emotion, widget: string }

          - label: Solution Section
            name: solution
            widget: object
            fields:
              - label: Sections
                name: sections
                widget: list
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Link Phrase, name: linkPhrase, widget: string, required: false }
                  - { label: Screen Image Path, name: screen, widget: string }
                  - { label: Phone Count, name: phones, widget: number }

          - label: Science Section
            name: science
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Panels
                name: panels
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Image Path, name: image, widget: string }
                  - label: CTA
                    name: cta
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: href, widget: string }

          - label: Pricing Section
            name: pricing
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Subheading, name: subheading, widget: text }
              - label: Plans
                name: plans
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Price, name: price, widget: string }
                  - { label: Period, name: period, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Link Phrase, name: linkPhrase, widget: string, required: false }
                  - { label: Image Path, name: image, widget: string, required: false }
                  - { label: Image Focus, name: imageFocus, widget: string, required: false }
                  - label: CTA
                    name: cta
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: href, widget: string }
                  - { label: Primary (featured card), name: primary, widget: boolean }
              - label: Value Highlights
                name: valueHighlights
                widget: list
                field: { label: Highlight, name: highlight, widget: string }

          - label: Comparison Section
            name: comparison
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Subheading, name: subheading, widget: string }
              - label: Column Headers
                name: cols
                widget: list
                field: { label: Column, name: col, widget: string }
              - label: Rows
                name: rows
                widget: list
                fields:
                  - { label: Row Label, name: label, widget: string }
                  - { label: alignd Column, name: alignd, widget: text }
                  - { label: Traditional Coaching Column, name: traditional, widget: text }
                  - { label: Parental Control Tech Column, name: parentalTech, widget: text }

          - label: Social Proof
            name: socialProof
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Quotes
                name: panels
                widget: list
                fields:
                  - { label: Quote, name: quote, widget: text }
                  - { label: Attribution, name: attribution, widget: string }

  # ─── Site Settings ────────────────────────────────────────────────────────────
  - name: site-settings
    label: Site Settings
    files:
      - label: Global Site Settings
        name: site
        file: content/site.json
        fields:
          - { label: Brand Name, name: brand, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - label: Navigation
            name: nav
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: href, widget: string }
          - label: CTAs
            name: cta
            widget: object
            fields:
              - label: Sign In Button
                name: signIn
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: href, widget: string }
              - label: Get Started Button
                name: getStarted
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: href, widget: string }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Copyright Text, name: copyright, widget: string }
              - label: Footer Links
                name: links
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: href, widget: string }
              - label: Contact Emails
                name: contacts
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Email, name: email, widget: string }

  # ─── FAQs ─────────────────────────────────────────────────────────────────────
  - name: faqs
    label: FAQs
    files:
      - label: Support & FAQs Page
        name: faqs
        file: content/faqs.json
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Intro Text, name: intro, widget: text }
          - { label: Contact Note, name: contactNote, widget: text }
          - { label: Contact Email, name: contactEmail, widget: string }
          - { label: Response Time Note, name: responseTime, widget: text }
          - label: Categories
            name: categories
            widget: list
            fields:
              - { label: Category Name, name: category, widget: string }
              - label: FAQs
                name: faqs
                widget: list
                fields:
                  - { label: Question, name: q, widget: string }
                  - { label: Answer, name: a, widget: text }

  # ─── Plan Timeline ────────────────────────────────────────────────────────────
  - name: plan-timeline
    label: Plan Timeline
    files:
      - label: 8-Week Plan Timeline
        name: plan-timeline
        file: content/plan-timeline.json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - label: Weeks
            name: weeks
            widget: list
            fields:
              - { label: Week Number, name: week, widget: number }
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }

  # ─── About ────────────────────────────────────────────────────────────────────
  - name: about
    label: About Page
    files:
      - label: Page Content (headings & meta)
        name: page
        file: content/about/page.json
        fields:
          - label: Meta
            name: meta
            widget: object
            fields:
              - { label: Page Title, name: title, widget: string }
              - { label: Meta Description, name: description, widget: text }
          - label: Mission
            name: mission
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Image Alt Text, name: imageAlt, widget: string }
          - label: Clinical
            name: clinical
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Image Placeholder Text, name: placeholder, widget: string }
              - { label: Image Path, name: image, widget: string, required: false }
              - { label: Image Alt Text, name: imageAlt, widget: string }
          - label: COM-B
            name: comb
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
          - label: Technology
            name: technology
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Image Placeholder Text, name: placeholder, widget: string }
              - { label: Image Path, name: image, widget: string, required: false }
              - { label: Image Alt Text, name: imageAlt, widget: string }
          - label: Team
            name: team
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Bio Button Label, name: bioButton, widget: string }
              - { label: Bio Button Aria Label, name: bioButtonAria, widget: string }
              - { label: Modal Close Aria Label, name: modalCloseAria, widget: string }
              - { label: LinkedIn Label, name: linkedinLabel, widget: string }

      - label: Mission
        name: mission
        file: content/about/mission.md
        fields:
          - { label: Body, name: body, widget: markdown }

      - label: Clinical Expertise
        name: clinical
        file: content/about/clinical.md
        fields:
          - { label: Body, name: body, widget: markdown }

      - label: COM-B Framework (copy)
        name: com-b-copy
        file: content/about/com-b.md
        fields:
          - { label: Body, name: body, widget: markdown }

      - label: COM-B Framework (diagram labels)
        name: com-b-data
        file: content/about/com-b.json
        fields:
          - { label: Centre Label, name: center, widget: string }
          - label: Nodes
            name: nodes
            widget: list
            fields:
              - { label: Key, name: key, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Description, name: desc, widget: string }

      - label: Technology (copy)
        name: technology-copy
        file: content/about/technology.md
        fields:
          - { label: Body, name: body, widget: markdown }

      - label: Technology (five layers modal)
        name: technology-data
        file: content/about/technology.json
        fields:
          - { label: Link Phrase (highlighted words), name: linkPhrase, widget: string }
          - { label: Modal Heading, name: modalHeading, widget: string }
          - label: Table Column Headers
            name: cols
            widget: list
            field: { label: Header, name: header, widget: string }
          - label: Layers
            name: layers
            widget: list
            fields:
              - { label: Layer Name, name: name, widget: string }
              - { label: What it adds, name: adds, widget: text }
              - { label: "Why a frontier model alone can't do it", name: why, widget: text }

      - label: Founding Team (intro copy)
        name: founding-team
        file: content/about/founding-team.md
        fields:
          - { label: Body, name: body, widget: markdown }

      - label: Team Members
        name: team
        file: content/about/team.json
        fields:
          - label: Team Members
            name: members
            widget: list
            fields:
              - { label: ID (slug, no spaces), name: id, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Headshot Image Path, name: headshot, widget: string, required: false }
              - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
              - { label: Bio, name: bio, widget: text }

  # ─── Auth Pages ───────────────────────────────────────────────────────────────
  - name: auth
    label: Auth Pages
    files:
      - label: Sign In & Sign Up
        name: auth
        file: content/auth.json
        fields:
          - label: Sign In
            name: signin
            widget: object
            fields:
              - label: Meta
                name: meta
                widget: object
                fields:
                  - { label: Page Title, name: title, widget: string }
                  - { label: Meta Description, name: description, widget: text }
              - { label: Heading, name: heading, widget: string }
              - label: Social Buttons
                name: social
                widget: object
                fields:
                  - { label: Google Button Label, name: google, widget: string }
                  - { label: Microsoft Button Label, name: microsoft, widget: string }
              - { label: Divider Text, name: divider, widget: string }
              - label: Fields
                name: fields
                widget: object
                fields:
                  - label: Email Field
                    name: email
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Placeholder, name: placeholder, widget: string }
                  - label: Password Field
                    name: password
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Placeholder, name: placeholder, widget: string }
              - label: Password Toggle
                name: passwordToggle
                widget: object
                fields:
                  - { label: Show Label, name: show, widget: string }
                  - { label: Hide Label, name: hide, widget: string }
              - { label: Forgot Password Link Text, name: forgot, widget: string }
              - { label: Submit Button Label, name: submit, widget: string }
              - label: Switch to Sign Up
                name: switch
                widget: object
                fields:
                  - { label: Prompt Text, name: prompt, widget: string }
                  - { label: Link Text, name: link, widget: string }
          - label: Sign Up
            name: signup
            widget: object
            fields:
              - label: Meta
                name: meta
                widget: object
                fields:
                  - { label: Page Title, name: title, widget: string }
                  - { label: Meta Description, name: description, widget: text }
              - { label: Heading, name: heading, widget: string }
              - label: Social Buttons
                name: social
                widget: object
                fields:
                  - { label: Google Button Label, name: google, widget: string }
                  - { label: Microsoft Button Label, name: microsoft, widget: string }
              - { label: Divider Text, name: divider, widget: string }
              - label: Fields
                name: fields
                widget: object
                fields:
                  - label: First Name Field
                    name: firstName
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Placeholder, name: placeholder, widget: string }
                  - label: Email Field
                    name: email
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Placeholder, name: placeholder, widget: string }
                  - label: Password Field
                    name: password
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Hint, name: hint, widget: text }
                      - { label: Placeholder, name: placeholder, widget: string }
              - label: Password Toggle
                name: passwordToggle
                widget: object
                fields:
                  - { label: Show Label, name: show, widget: string }
                  - { label: Hide Label, name: hide, widget: string }
              - label: Password Strength Levels
                name: strengthLevels
                widget: list
                field: { label: Level, name: level, widget: string }
              - { label: Submit Button Label, name: submit, widget: string }
              - label: Switch to Sign In
                name: switch
                widget: object
                fields:
                  - { label: Prompt Text, name: prompt, widget: string }
                  - { label: Link Text, name: link, widget: string }

  # ─── 404 Page ─────────────────────────────────────────────────────────────────
  - name: not-found
    label: 404 Page
    files:
      - label: 404 Page Content
        name: not-found
        file: content/404.json
        fields:
          - { label: Error Code, name: code, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Body, name: body, widget: text }
          - { label: Home Button Label, name: homeLabel, widget: string }
          - { label: Support Button Label, name: supportLabel, widget: string }

  # ─── Legal ────────────────────────────────────────────────────────────────────
  - name: legal
    label: Legal
    files:
      - label: Page Headings
        name: pages
        file: content/legal/pages.json
        fields:
          - label: Terms
            name: terms
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Last Updated Text, name: lastUpdated, widget: string }
          - label: Privacy
            name: privacy
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Last Updated Text, name: lastUpdated, widget: string }

      - label: Privacy Policy
        name: privacy
        file: content/legal/privacy.md
        fields:
          - { label: Body, name: body, widget: markdown }

      - label: Terms & Conditions
        name: terms
        file: content/legal/terms.md
        fields:
          - { label: Body, name: body, widget: markdown }
